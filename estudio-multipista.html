<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Multipista">
<meta name="theme-color" content="#15130f">

<style>
  :root{
    --bg:#15130f;
    --panel:#211d18;
    --panel-raised:#2b261f;
    --line:#3a342a;
    --text:#f2ece1;
    --text-dim:#9a9184;
    --rec:#e2472b;
    --rec-dim:#5c2c22;
    --play:#4fb8a6;
    --play-dim:#274943;
    --amber:#e0a458;
    --font-display: 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
    --font-mono: ui-monospace, 'SF Mono', 'Consolas', monospace;
    --font-body: -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);}
  body{
    min-height:100vh;
    padding:18px 14px 100px;
    background-image:
      linear-gradient(var(--bg), var(--bg)),
      repeating-linear-gradient(180deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
  }
  header{margin-bottom:18px;}
  .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.18em;
    color:var(--amber);
    text-transform:uppercase;
    margin:0 0 4px;
  }
  h1{
    font-family:var(--font-display);
    font-weight:800;
    font-size:30px;
    letter-spacing:.02em;
    text-transform:uppercase;
    margin:0;
    line-height:1.05;
  }
  .sub{color:var(--text-dim); font-size:13px; margin-top:6px;}

  #toast{
    position:fixed; left:14px; right:14px; bottom:90px;
    background:var(--panel-raised); border:1px solid var(--line);
    padding:10px 14px; border-radius:10px; font-size:13px;
    color:var(--text); box-shadow:0 8px 24px rgba(0,0,0,.4);
    display:none; z-index:50;
  }

  .empty{
    border:1px dashed var(--line);
    border-radius:14px;
    padding:36px 20px;
    text-align:center;
    color:var(--text-dim);
    font-size:14px;
  }
  .empty b{color:var(--text); display:block; font-family:var(--font-display); font-size:18px; text-transform:uppercase; margin-bottom:6px; letter-spacing:.03em;}

  .track{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px;
    margin-bottom:10px;
    position:relative;
    overflow:hidden;
  }
  .track.recording{ border-color:var(--rec); box-shadow: 0 0 0 1px var(--rec) inset; }
  .track-top{
    display:flex; align-items:center; gap:10px; margin-bottom:8px;
  }
  .track-num{
    font-family:var(--font-mono); font-size:11px; color:var(--text-dim);
    width:22px; flex-shrink:0;
  }
  .track-name{
    font-family:var(--font-display); font-weight:700; font-size:15px;
    text-transform:uppercase; letter-spacing:.02em;
    background:none; border:none; color:var(--text);
    width:100%; padding:2px 0;
  }
  .track-name:focus{outline:none; border-bottom:1px solid var(--amber);}
  .track-time{ font-family:var(--font-mono); font-size:12px; color:var(--text-dim); white-space:nowrap; }

  .track-viz{
    height:44px; background:var(--panel-raised); border-radius:8px;
    margin-bottom:10px; position:relative; overflow:hidden;
  }
  canvas.wave{width:100%; height:100%; display:block;}
  .meter-fill{
    position:absolute; left:0; top:0; bottom:0; width:0%;
    background:linear-gradient(90deg, var(--rec), var(--amber));
    opacity:.55;
  }
  .rec-dot{
    position:absolute; top:8px; left:10px; width:8px; height:8px; border-radius:50%;
    background:var(--rec); animation: pulse 1s infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.25;} }
  .empty-viz{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); font-size:12px; font-family:var(--font-mono);
  }

  .track-controls{ display:flex; align-items:center; gap:8px; }
  .btn{
    border:none; border-radius:9px; padding:9px 12px; font-size:13px;
    font-family:var(--font-body); font-weight:600; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
    color:var(--text); background:var(--panel-raised);
    transition: transform .08s ease;
  }
  .btn:active{ transform: scale(.96); }
  .btn.rec{ background:var(--rec-dim); color:#ffd9d0; }
  .btn.rec.active{ background:var(--rec); color:#1a0d0a; }
  .btn.play{ background:var(--play-dim); color:#d8f5ef; }
  .btn.play.active{ background:var(--play); color:#0c211d; }
  .btn.ghost{ background:transparent; color:var(--text-dim); padding:9px; }
  .btn:disabled{ opacity:.35; cursor:default; }
  .spacer{flex:1;}
  .mute-toggle{
    width:34px; height:34px; border-radius:9px; border:1px solid var(--line);
    background:var(--panel-raised); color:var(--text-dim); font-size:12px; font-family:var(--font-mono);
    cursor:pointer;
  }
  .mute-toggle.muted{ background:var(--amber); color:#241a08; border-color:var(--amber); }

  #addTrack{
    width:100%; padding:14px; border-radius:12px; border:1px dashed var(--line);
    background:transparent; color:var(--text-dim); font-size:14px; font-weight:600;
    cursor:pointer; margin-top:4px;
  }
  #addTrack:active{ background:var(--panel); }

  .transport{
    position:fixed; left:0; right:0; bottom:0;
    background:var(--panel); border-top:1px solid var(--line);
    padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    display:flex; align-items:center; gap:10px;
    backdrop-filter: blur(6px);
  }
  .transport .btn{ flex:1; justify-content:center; padding:12px; }
  .transport .master-time{
    font-family:var(--font-mono); font-size:13px; color:var(--text-dim); min-width:44px; text-align:center;
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Estudio de bolsillo</p>
  <h1>Multipista</h1>
  <p class="sub">Grabá cada pista por separado, escuchá las anteriores mientras grabás una nueva, y exportá la mezcla.</p>
</header>

<div id="trackList"></div>
<button id="addTrack">+ Agregar pista</button>

<div class="transport">
  <button class="btn play" id="playAllBtn">▶ Escuchar mezcla</button>
  <span class="master-time" id="masterTime">0:00</span>
  <button class="btn ghost" id="exportBtn" title="Exportar mezcla como WAV">⬇ WAV</button>
</div>

<div id="toast"></div>

<script>
(function(){
  const trackListEl = document.getElementById('trackList');
  const toastEl = document.getElementById('toast');
  const playAllBtn = document.getElementById('playAllBtn');
  const exportBtn = document.getElementById('exportBtn');
  const masterTimeEl = document.getElementById('masterTime');

  let audioCtx = null;
  let micStream = null;
  let tracks = [];
  let nextId = 1;
  let activeSources = [];   // currently playing AudioBufferSourceNodes
  let masterPlaying = false;
  let masterRAF = null;
  let masterStartTime = 0;

  function toast(msg, ms){
    toastEl.textContent = msg;
    toastEl.style.display = 'block';
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(()=>{ toastEl.style.display='none'; }, ms || 3200);
  }

  function ensureCtx(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  async function ensureMic(){
    if(micStream) return micStream;
    micStream = await navigator.mediaDevices.getUserMedia({ audio: {
      echoCancellation:true, noiseSuppression:false, autoGainControl:false
    }});
    return micStream;
  }

  function fmtTime(sec){
    if(!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec/60);
    const s = Math.floor(sec%60);
    return m + ':' + String(s).padStart(2,'0');
  }

  function makeTrack(){
    const t = {
      id: nextId++,
      name: 'Pista ' + (tracks.length+1),
      buffer: null,       // decoded AudioBuffer
      duration: 0,
      muted: false,
      isRecording: false,
      isPlaying: false,
      mediaRecorder: null,
      chunks: [],
      analyser: null,
      meterRAF: null,
    };
    tracks.push(t);
    return t;
  }

  function stopAllPlayback(){
    activeSources.forEach(s => { try{ s.stop(); }catch(e){} });
    activeSources = [];
    tracks.forEach(t => t.isPlaying = false);
    masterPlaying = false;
    if(masterRAF) cancelAnimationFrame(masterRAF);
    playAllBtn.textContent = '▶ Escuchar mezcla';
    playAllBtn.classList.remove('active');
    render();
  }

  function longestDuration(exceptId){
    return tracks.reduce((m,t)=> (t.buffer && t.id!==exceptId) ? Math.max(m, t.buffer.duration) : m, 0);
  }

  // Schedule playback of given tracks (array) starting now; returns array of source nodes
  function scheduleTracks(trackArr, when, ctx){
    const nodes = [];
    trackArr.forEach(t=>{
      if(!t.buffer || t.muted) return;
      const src = ctx.createBufferSource();
      src.buffer = t.buffer;
      const gain = ctx.createGain();
      gain.gain.value = 1;
      src.connect(gain).connect(ctx.destination);
      src.start(when);
      nodes.push(src);
      t.isPlaying = true;
      src.onended = () => { t.isPlaying = false; render(); };
    });
    return nodes;
  }

  async function toggleRecord(trackId){
    const t = tracks.find(x=>x.id===trackId);
    if(!t) return;
    if(t.isRecording){
      stopRecording(t);
      return;
    }
    if(tracks.some(x=>x.isRecording)){
      toast('Ya hay una pista grabando.');
      return;
    }
    try{
      await ensureMic();
    }catch(e){
      toast('No se pudo acceder al micrófono. Revisá los permisos del navegador.');
      return;
    }
    const ctx = ensureCtx();
    stopAllPlayback();

    const source = ctx.createMediaStreamSource(micStream);
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 256;
    source.connect(analyser);
    t.analyser = analyser;

    const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
    const mr = new MediaRecorder(micStream, mimeType ? {mimeType} : undefined);
    t.mediaRecorder = mr;
    t.chunks = [];
    mr.ondataavailable = e => { if(e.data && e.data.size) t.chunks.push(e.data); };
    mr.onstop = async () => {
      const blob = new Blob(t.chunks, {type: mr.mimeType || 'audio/webm'});
      try{
        const arr = await blob.arrayBuffer();
        const buf = await ctx.decodeAudioData(arr.slice(0));
        t.buffer = buf;
        t.duration = buf.duration;
      }catch(err){
        toast('No se pudo procesar la grabación.');
      }
      t.isRecording = false;
      render();
    };

    // Play back other tracks for reference while recording (overdub)
    const others = tracks.filter(x=>x.id!==t.id && x.buffer);
    t.isRecording = true;
    render();
    startMeter(t);

    const startAt = ctx.currentTime + 0.05;
    activeSources = scheduleTracks(others, startAt, ctx);
    mr.start();

    // auto-stop overdub reference playback when it's longer than nothing (let it play through)
  }

  function stopRecording(t){
    if(t.mediaRecorder && t.mediaRecorder.state !== 'inactive'){
      t.mediaRecorder.stop();
    }
    stopMeter(t);
    activeSources.forEach(s=>{ try{ s.stop(); }catch(e){} });
    activeSources = [];
  }

  function startMeter(t){
    const data = new Uint8Array(t.analyser.fftSize);
    const el = document.querySelector('.track[data-id="'+t.id+'"] .meter-fill');
    function loop(){
      if(!t.isRecording){ return; }
      t.analyser.getByteTimeDomainData(data);
      let sum = 0;
      for(let i=0;i<data.length;i++){ const v=(data[i]-128)/128; sum += v*v; }
      const rms = Math.sqrt(sum/data.length);
      const pct = Math.min(100, rms*260);
      const liveEl = document.querySelector('.track[data-id="'+t.id+'"] .meter-fill');
      if(liveEl) liveEl.style.width = pct+'%';
      t.meterRAF = requestAnimationFrame(loop);
    }
    loop();
  }
  function stopMeter(t){
    if(t.meterRAF) cancelAnimationFrame(t.meterRAF);
    t.meterRAF = null;
  }

  function playTrack(trackId){
    const t = tracks.find(x=>x.id===trackId);
    if(!t || !t.buffer) return;
    const ctx = ensureCtx();
    stopAllPlayback();
    const src = ctx.createBufferSource();
    src.buffer = t.buffer;
    src.connect(ctx.destination);
    src.start();
    t.isPlaying = true;
    activeSources = [src];
    src.onended = ()=>{ t.isPlaying = false; render(); };
    render();
  }

  function playAll(){
    const ctx = ensureCtx();
    if(masterPlaying){ stopAllPlayback(); return; }
    const withAudio = tracks.filter(t=>t.buffer);
    if(withAudio.length === 0){ toast('Grabá al menos una pista primero.'); return; }
    const dur = longestDuration();
    const startAt = ctx.currentTime + 0.05;
    activeSources = scheduleTracks(withAudio, startAt, ctx);
    masterPlaying = true;
    masterStartTime = performance.now();
    playAllBtn.textContent = '■ Detener';
    playAllBtn.classList.add('active');
    render();

    function tick(){
      if(!masterPlaying) return;
      const elapsed = (performance.now()-masterStartTime)/1000;
      masterTimeEl.textContent = fmtTime(Math.min(elapsed, dur));
      if(elapsed >= dur){
        stopAllPlayback();
        masterTimeEl.textContent = '0:00';
        return;
      }
      masterRAF = requestAnimationFrame(tick);
    }
    tick();
  }

  function toggleMute(trackId){
    const t = tracks.find(x=>x.id===trackId);
    if(!t) return;
    t.muted = !t.muted;
    render();
  }

  function deleteTrack(trackId){
    const t = tracks.find(x=>x.id===trackId);
    if(t && t.isRecording) stopRecording(t);
    tracks = tracks.filter(x=>x.id!==trackId);
    render();
  }

  function drawWave(canvas, buffer){
    const ctx2d = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = w*dpr; canvas.height = h*dpr;
    ctx2d.scale(dpr,dpr);
    ctx2d.clearRect(0,0,w,h);
    const data = buffer.getChannelData(0);
    const step = Math.ceil(data.length / w);
    ctx2d.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--play').trim() || '#4fb8a6';
    for(let x=0;x<w;x++){
      let min=1, max=-1;
      const start = x*step;
      for(let i=0;i<step;i++){
        const v = data[start+i] || 0;
        if(v<min) min=v;
        if(v>max) max=v;
      }
      const y1 = (1+min)*0.5*h;
      const y2 = (1+max)*0.5*h;
      ctx2d.fillRect(x, Math.min(y1,y2), 1, Math.max(2, Math.abs(y2-y1)));
    }
  }

  function render(){
    if(tracks.length === 0){
      trackListEl.innerHTML = '<div class="empty"><b>Sin pistas todavía</b>Tocá "Agregar pista" y grabá tu primera idea.</div>';
      exportBtn.disabled = true;
      return;
    }
    exportBtn.disabled = !tracks.some(t=>t.buffer);

    trackListEl.innerHTML = tracks.map((t,i)=>`
      <div class="track ${t.isRecording?'recording':''}" data-id="${t.id}">
        <div class="track-top">
          <span class="track-num">${String(i+1).padStart(2,'0')}</span>
          <input class="track-name" value="${t.name.replace(/"/g,'&quot;')}" data-name-id="${t.id}" />
          <span class="track-time">${t.buffer ? fmtTime(t.duration) : (t.isRecording ? 'grabando…' : '—')}</span>
        </div>
        <div class="track-viz">
          ${t.isRecording ? '<div class="rec-dot"></div><div class="meter-fill"></div>' : ''}
          ${t.buffer ? '<canvas class="wave" data-wave-id="'+t.id+'"></canvas>' : (t.isRecording ? '' : '<div class="empty-viz">sin audio</div>')}
        </div>
        <div class="track-controls">
          <button class="btn rec ${t.isRecording?'active':''}" data-action="record" data-id="${t.id}">
            ${t.isRecording ? '■ Detener' : '● Grabar'}
          </button>
          <button class="btn play ${t.isPlaying?'active':''}" data-action="play" data-id="${t.id}" ${!t.buffer||t.isRecording?'disabled':''}>
            ▶ Escuchar
          </button>
          <div class="spacer"></div>
          <button class="mute-toggle ${t.muted?'muted':''}" data-action="mute" data-id="${t.id}" title="Silenciar">${t.muted?'M':'M'}</button>
          <button class="btn ghost" data-action="delete" data-id="${t.id}" title="Eliminar pista">✕</button>
        </div>
      </div>
    `).join('');

    tracks.forEach(t=>{
      if(t.buffer){
        const c = trackListEl.querySelector('canvas[data-wave-id="'+t.id+'"]');
        if(c) drawWave(c, t.buffer);
      }
    });
  }

  trackListEl.addEventListener('click', (e)=>{
    const btn = e.target.closest('button[data-action]');
    if(!btn) return;
    const id = Number(btn.dataset.id);
    const action = btn.dataset.action;
    if(action==='record') toggleRecord(id);
    if(action==='play') playTrack(id);
    if(action==='mute') toggleMute(id);
    if(action==='delete') deleteTrack(id);
  });
  trackListEl.addEventListener('change', (e)=>{
    const input = e.target.closest('input[data-name-id]');
    if(!input) return;
    const t = tracks.find(x=>x.id===Number(input.dataset.nameId));
    if(t) t.name = input.value || t.name;
  });

  document.getElementById('addTrack').addEventListener('click', ()=>{
    makeTrack();
    render();
  });

  playAllBtn.addEventListener('click', playAll);

  // ---- WAV export (mixdown of all unmuted tracks) ----
  async function exportMix(){
    const withAudio = tracks.filter(t=>t.buffer && !t.muted);
    if(withAudio.length === 0){ toast('No hay pistas audibles para exportar.'); return; }
    const ctx = ensureCtx();
    const dur = Math.max(...withAudio.map(t=>t.buffer.duration));
    const sampleRate = ctx.sampleRate;
    const offline = new OfflineAudioContext(2, Math.ceil(dur*sampleRate), sampleRate);
    withAudio.forEach(t=>{
      const src = offline.createBufferSource();
      src.buffer = t.buffer;
      src.connect(offline.destination);
      src.start(0);
    });
    toast('Generando mezcla…', 4000);
    const rendered = await offline.startRendering();
    const wavBlob = audioBufferToWav(rendered);
    const url = URL.createObjectURL(wavBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'mezcla.wav';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }

  function audioBufferToWav(buffer){
    const numChan = buffer.numberOfChannels;
    const len = buffer.length * numChan * 2 + 44;
    const arrBuf = new ArrayBuffer(len);
    const view = new DataView(arrBuf);
    const writeStr = (offset, str) => { for(let i=0;i<str.length;i++) view.setUint8(offset+i, str.charCodeAt(i)); };

    writeStr(0,'RIFF');
    view.setUint32(4, 36 + buffer.length*numChan*2, true);
    writeStr(8,'WAVE');
    writeStr(12,'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, numChan, true);
    view.setUint32(24, buffer.sampleRate, true);
    view.setUint32(28, buffer.sampleRate * numChan * 2, true);
    view.setUint16(32, numChan*2, true);
    view.setUint16(34, 16, true);
    writeStr(36,'data');
    view.setUint32(40, buffer.length*numChan*2, true);

    const channels = [];
    for(let c=0;c<numChan;c++) channels.push(buffer.getChannelData(c));
    let offset = 44;
    for(let i=0;i<buffer.length;i++){
      for(let c=0;c<numChan;c++){
        let s = Math.max(-1, Math.min(1, channels[c][i]));
        s = s < 0 ? s*0x8000 : s*0x7FFF;
        view.setInt16(offset, s, true);
        offset += 2;
      }
    }
    return new Blob([arrBuf], {type:'audio/wav'});
  }

  exportBtn.addEventListener('click', exportMix);

  // start with one track ready to go
  makeTrack();
  render();
})();
</script>
</body>
</html>
